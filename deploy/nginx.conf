events {}

http {
    # Docker's embedded DNS resolver. Needed so nginx re-resolves the "api"
    # service name per request instead of caching one replica's IP at startup.
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;
        client_max_body_size 25m;  # allow bulk image uploads through the proxy

        location / {
            # Using a variable (not a static upstream) forces nginx to resolve
            # "api" on each request. docker-compose --scale api=N registers all
            # replicas under this name, and Docker DNS round-robins across them,
            # which is what actually distributes load across the replicas.
            set $backend "http://api:8000";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
        }
    }
}
